<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenador de Kegels</title>

  <!-- Manifest PWA -->
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;:&quot;Entrenador Kegels&quot;,
    &quot;short_name&quot;:&quot;Kegels&quot;,
    &quot;start_url&quot;:&quot;.&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#020617&quot;,
    &quot;theme_color&quot;:&quot;#22c55e&quot;,
    &quot;icons&quot;:[{
      &quot;src&quot;:&quot;data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAFUlEQVR4Xu3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAvg0hAAE1zZxNAAAAAElFTkSuQmCC&quot;,
      &quot;sizes&quot;:&quot;192x192&quot;,
      &quot;type&quot;:&quot;image/png&quot;
    }]
  }">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      padding: 24px;
      border-radius: 16px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: #22c55e;
      color: #022c22;
      cursor: pointer;
    }
    button.stop {
      background: #ef4444;
      color: #450a0a;
    }
    button.reset {
      background: #6366f1;
      color: #eef2ff;
    }
    .timer { font-size: 32px; margin: 12px 0; }
    .state { font-size: 16px; margin-top: 6px; }
    .progress { margin-top: 8px; font-size: 14px; color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Rutina Kegel Guiada</h1>

    <div class="progress" id="weekInfo">Semana 1</div>
    <div class="progress" id="sessionType">Sesión 1</div>
    <div class="timer" id="timer">00</div>
    <div class="state" id="state">Listo</div>
    <div class="state" id="reps">Reps: 0 / 15</div>
    <div class="progress" id="daily">Sesiones hoy: 0 / 3</div>

    <button id="startBtn">Iniciar sesión</button>
    <button id="stopBtn" class="stop" style="display:none">Detener</button>
    <button id="resetBtn" class="reset">Reiniciar progreso</button>
  </div>

<script>
  let interval;
  let isContract = true;
  let seconds = 0;
  let reps = 0;

  const maxReps = 15;
  const dailyGoal = 3;
  const startDateKey = 'kegel-start-date';

  const timerEl = document.getElementById('timer');
  const stateEl = document.getElementById('state');
  const repsEl = document.getElementById('reps');
  const dailyEl = document.getElementById('daily');
  const sessionTypeEl = document.getElementById('sessionType');
  const weekInfoEl = document.getElementById('weekInfo');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beep(freq = 800, duration = 120) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.start();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration / 1000);
    osc.stop(audioCtx.currentTime + duration / 1000);
  }

  function vibrate(pattern = 100) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function todayKey() {
    const d = new Date();
    return `kegel-${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  function getDailySessions() {
    return Number(localStorage.getItem(todayKey())) || 0;
  }

  function addDailySession() {
    localStorage.setItem(todayKey(), getDailySessions() + 1);
    updateDailyUI();
  }

  function getWeek() {
    let start = localStorage.getItem(startDateKey);
    if (!start) {
      start = new Date().toISOString();
      localStorage.setItem(startDateKey, start);
    }
    const diffDays = Math.floor((Date.now() - new Date(start)) / (1000 * 60 * 60 * 24));
    if (diffDays < 7) return 1;
    if (diffDays < 14) return 2;
    return 3;
  }

  function getSessionConfig(done, week) {
    if (week >= 2 && done === 0) {
      return { label: 'Sesión 1: Fuerza (5s)', duration: 5 };
    }
    if (done === 0) return { label: 'Sesión 1: Base (3s)', duration: 3 };
    if (done === 1) return { label: 'Sesión 2: Base (3s)', duration: 3 };
    if (done === 2) return { label: 'Sesión 3: Pulsos (1s)', duration: 1 };
    return null;
  }

  function updateDailyUI() {
    const done = getDailySessions();
    const week = getWeek();
    weekInfoEl.textContent = `Semana ${week}`;
    dailyEl.textContent = `Sesiones hoy: ${done} / ${dailyGoal}`;
    const cfg = getSessionConfig(done, week);
    sessionTypeEl.textContent = cfg ? cfg.label : 'Rutina diaria completada 🎉';
  }

  updateDailyUI();

  startBtn.onclick = () => {
    const done = getDailySessions();
    if (done >= dailyGoal) return;

    const week = getWeek();
    const cfg = getSessionConfig(done, week);

    clearInterval(interval);
    seconds = cfg.duration;
    reps = 0;
    isContract = true;

    stateEl.textContent = 'Aprieta';
    timerEl.textContent = seconds;
    repsEl.textContent = `Reps: ${reps} / ${maxReps}`;

    beep(1000);
    vibrate(120);

    startBtn.style.display = 'none';
    stopBtn.style.display = 'block';

    interval = setInterval(() => {
      seconds--;
      timerEl.textContent = seconds;

      if (seconds === 0) {
        beep(isContract ? 800 : 500);
        vibrate(isContract ? 80 : 120);

        if (!isContract) {
          reps++;
          repsEl.textContent = `Reps: ${reps} / ${maxReps}`;
          if (reps >= maxReps) {
            clearInterval(interval);
            stateEl.textContent = 'Sesión completada ✔';
            timerEl.textContent = '00';
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            addDailySession();
            return;
          }
        }

        isContract = !isContract;
        stateEl.textContent = isContract ? 'Aprieta' : 'Relaja';
        seconds = cfg.duration;
      }
    }, 1000);
  };

  stopBtn.onclick = () => {
    clearInterval(interval);
    stateEl.textContent = 'Listo';
    timerEl.textContent = '00';
    startBtn.style.display = 'block';
    stopBtn.style.display = 'none';
  };

  resetBtn.onclick = () => {
    localStorage.clear();
    location.reload();
  };
</script>
</body>
</html>
